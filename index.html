<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>לוח הכפל של עילי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#7ec8e3;
    --sky-deep:#4a9fc4;
    --sun:#ffd23f;
    --sun-deep:#f4a900;
    --grass:#8bd450;
    --coral:#ff6b6b;
    --plum:#9b5de5;
    --mint:#4ecdc4;
    --cream:#fff8e7;
    --ink:#3a2e4d;
    --bead-shadow:rgba(58,46,77,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Fredoka','Heebo',sans-serif;
    background:
      radial-gradient(circle at 80% 12%, rgba(255,210,63,.55), transparent 38%),
      linear-gradient(180deg,#aee5f4 0%, #7ec8e3 45%, #b6e8a0 100%);
    color:var(--ink);
    overflow-x:hidden;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:14px 12px 30px;
    position:relative;
  }
  /* עננים מצוירים */
  .cloud{position:fixed;background:#fff;border-radius:50%;opacity:.85;filter:blur(.3px);z-index:0;pointer-events:none;}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%;}
  .c1{width:80px;height:80px;top:8%;left:6%;animation:drift 26s linear infinite;}
  .c1::before{width:55px;height:55px;top:18px;left:-32px;}
  .c1::after{width:65px;height:65px;top:12px;left:42px;}
  .c2{width:55px;height:55px;top:22%;right:10%;animation:drift 34s linear infinite reverse;}
  .c2::before{width:40px;height:40px;top:14px;left:-22px;}
  .c2::after{width:45px;height:45px;top:10px;left:30px;}
  @keyframes drift{0%{transform:translateX(0);}50%{transform:translateX(30px);}100%{transform:translateX(0);}}

  .wrap{width:100%;max-width:520px;position:relative;z-index:2;}

  /* כותרת + ניקוד */
  header{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;margin-bottom:12px;
  }
  h1{
    font-size:1.5rem;font-weight:700;color:#fff;
    text-shadow:0 3px 0 var(--sun-deep), 0 5px 8px rgba(0,0,0,.18);
    letter-spacing:.5px;
  }
  .score-box{
    background:#fff;border-radius:18px;padding:8px 14px;
    box-shadow:0 5px 0 #e0c98f, 0 8px 14px rgba(0,0,0,.12);
    display:flex;align-items:center;gap:8px;font-weight:700;
    border:3px solid var(--sun);
  }
  .score-box .star{font-size:1.3rem;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));}
  .score-num{font-size:1.4rem;color:var(--sun-deep);}

  /* החשבוניה */
  .abacus{
    background:linear-gradient(165deg,#c98a4b,#a3672f);
    border-radius:22px;
    padding:14px 16px;
    box-shadow:
      inset 0 3px 8px rgba(255,255,255,.35),
      inset 0 -6px 12px rgba(0,0,0,.3),
      0 8px 0 #7c4a1d,
      0 14px 22px rgba(0,0,0,.25);
    margin-bottom:14px;
    border:3px solid #8a5523;
  }
  .abacus-title{
    text-align:center;color:#fff5e0;font-weight:600;font-size:.9rem;
    margin-bottom:8px;text-shadow:0 2px 3px rgba(0,0,0,.4);
  }
  .rod{
    display:flex;align-items:center;
    height:34px;margin:3px 0;
    position:relative;
  }
  .rod-line{
    position:absolute;left:6px;right:6px;height:5px;top:50%;
    transform:translateY(-50%);
    background:linear-gradient(#5a3413,#2e1a09);
    border-radius:3px;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.2);
  }
  .bead{
    width:26px;height:26px;border-radius:50%;
    margin:0 1.5px;position:relative;z-index:2;
    background:radial-gradient(circle at 32% 28%, #fff 0%, var(--bc,#ff6b6b) 42%, color-mix(in srgb,var(--bc,#ff6b6b) 60%, #000) 100%);
    box-shadow:0 3px 5px var(--bead-shadow), inset 0 -3px 4px rgba(0,0,0,.35);
    transition:transform .28s cubic-bezier(.34,1.56,.64,1), opacity .25s;
    cursor:pointer;
  }
  .bead.on{transform:translateX(0) scale(1.05);}
  .bead.off{opacity:.32;transform:scale(.82);}
  /* כל מוט בצבע אחר */
  .rod:nth-child(1) .bead{--bc:#ff6b6b;}
  .rod:nth-child(2) .bead{--bc:#ff9f43;}
  .rod:nth-child(3) .bead{--bc:#feca57;}
  .rod:nth-child(4) .bead{--bc:#8bd450;}
  .rod:nth-child(5) .bead{--bc:#4ecdc4;}
  .rod:nth-child(6) .bead{--bc:#54a0ff;}
  .rod:nth-child(7) .bead{--bc:#9b5de5;}
  .rod:nth-child(8) .bead{--bc:#f368e0;}
  .rod:nth-child(9) .bead{--bc:#ee5253;}

  .abacus-count{
    text-align:center;margin-top:8px;
    background:rgba(255,245,224,.92);
    border-radius:14px;padding:5px 0;font-weight:700;
    color:#7c4a1d;font-size:1rem;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.15);
  }
  .abacus-hint{font-size:.78rem;font-weight:500;color:#a3672f;}

  /* כרטיס התרגיל */
  .question-card{
    background:#fff;
    border-radius:26px;
    padding:20px 16px 22px;
    text-align:center;
    box-shadow:0 8px 0 #d9d2c4, 0 14px 24px rgba(0,0,0,.14);
    margin-bottom:14px;
    border:4px solid var(--mint);
    position:relative;
  }
  .question-card::before{
    content:"✏️";position:absolute;top:-18px;right:18px;font-size:1.8rem;
    transform:rotate(18deg);
  }
  .q-label{font-size:.9rem;color:#9aa0a6;font-weight:600;margin-bottom:4px;}
  .equation{
    font-family:'Heebo',sans-serif;
    font-size:3.1rem;font-weight:900;
    color:var(--ink);letter-spacing:1px;
    direction:ltr;
  }
  .equation .x{color:var(--coral);}
  .equation .q{color:var(--plum);}

  /* תשובות */
  .answers{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;
  }
  .answer-btn{
    font-family:'Heebo',sans-serif;
    font-size:2.1rem;font-weight:900;
    padding:18px 0;border:none;border-radius:22px;
    color:#fff;cursor:pointer;
    box-shadow:0 6px 0 var(--sh), 0 10px 16px rgba(0,0,0,.16);
    transition:transform .12s, box-shadow .12s, filter .2s;
    position:relative;
  }
  .answer-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh), 0 4px 8px rgba(0,0,0,.16);}
  .answer-btn:nth-child(1){background:var(--coral);--sh:#c9453f;}
  .answer-btn:nth-child(2){background:var(--mint);--sh:#36a89f;}
  .answer-btn:nth-child(3){background:var(--plum);--sh:#6f3cb3;}
  .answer-btn:nth-child(4){background:var(--sun-deep);--sh:#c98500;}
  .answer-btn.correct{
    background:var(--grass)!important;--sh:#5fa32f!important;
    animation:pop .45s cubic-bezier(.34,1.56,.64,1);
  }
  .answer-btn.wrong{
    filter:grayscale(.7) brightness(.85);
    animation:shake .4s;
  }
  .answer-btn:disabled{cursor:default;}
  @keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.14);}100%{transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}

  /* הודעת משוב */
  .feedback{
    text-align:center;margin-top:14px;min-height:54px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .feedback-msg{
    font-size:1.3rem;font-weight:700;
    opacity:0;transform:scale(.6);
    transition:opacity .3s, transform .3s;
  }
  .feedback-msg.show{opacity:1;transform:scale(1);}
  .feedback-msg.good{color:#3a8a1d;}
  .feedback-msg.try{color:var(--coral);}
  .next-btn{
    margin-top:8px;
    font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:600;
    background:#fff;color:var(--ink);
    border:3px solid var(--sun);
    padding:9px 26px;border-radius:30px;cursor:pointer;
    box-shadow:0 5px 0 #e0c98f;
    opacity:0;pointer-events:none;transition:opacity .3s, transform .12s;
  }
  .next-btn.show{opacity:1;pointer-events:auto;}
  .next-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #e0c98f;}

  /* קונפטי */
  .confetti{position:fixed;width:12px;height:12px;z-index:50;pointer-events:none;top:-20px;border-radius:2px;}
  @keyframes fall{
    to{transform:translateY(110vh) rotate(720deg);opacity:0;}
  }

  @media(max-width:380px){
    .bead{width:22px;height:22px;}
    .equation{font-size:2.6rem;}
    .answer-btn{font-size:1.8rem;}
  }
</style>
</head>
<body>
<div class="cloud c1"></div>
<div class="cloud c2"></div>

<div class="wrap">
  <header>
    <h1>🎯 לוח הכפל של עילי</h1>
    <div class="score-box">
      <span class="star">⭐</span>
      <span class="score-num" id="score">0</span>
    </div>
  </header>

  <!-- חשבוניה -->
  <div class="abacus">
    <div class="abacus-title">🧮 החשבוניה — לחצו על החרוזים כדי לספור</div>
    <div id="rods"></div>
    <div class="abacus-count">
      ספרתם: <span id="abacusNum">0</span>
      <span class="abacus-hint" id="abacusHint"></span>
    </div>
  </div>

  <!-- תרגיל -->
  <div class="question-card">
    <div class="q-label">כמה זה?</div>
    <div class="equation" id="equation"></div>
  </div>

  <!-- תשובות -->
  <div class="answers" id="answers"></div>

  <!-- משוב -->
  <div class="feedback">
    <div class="feedback-msg" id="feedbackMsg"></div>
    <button class="next-btn" id="nextBtn">תרגיל הבא ➜</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  const ROWS = 9, BEADS = 9;
  let a=0,b=0,answer=0,score=0,locked=false;

  const rodsEl   = document.getElementById('rods');
  const eqEl     = document.getElementById('equation');
  const ansEl    = document.getElementById('answers');
  const scoreEl  = document.getElementById('score');
  const msgEl    = document.getElementById('feedbackMsg');
  const nextBtn  = document.getElementById('nextBtn');
  const abNumEl  = document.getElementById('abacusNum');
  const abHintEl = document.getElementById('abacusHint');

  // ---- בניית החשבוניה ----
  // כל מוט = שורה של 9 חרוזים. החרוזים "פעילים" נספרים.
  const beadState = []; // beadState[row] = מספר חרוזים פעילים בשורה
  function buildAbacus(){
    rodsEl.innerHTML='';
    for(let r=0;r<ROWS;r++){
      beadState[r]=0;
      const rod=document.createElement('div');
      rod.className='rod';
      const line=document.createElement('div');
      line.className='rod-line';
      rod.appendChild(line);
      for(let i=0;i<BEADS;i++){
        const bead=document.createElement('div');
        bead.className='bead off';
        bead.dataset.row=r;
        bead.dataset.idx=i;
        bead.addEventListener('click',onBeadClick);
        rod.appendChild(bead);
      }
      rodsEl.appendChild(rod);
    }
    updateAbacusCount();
  }

  // לחיצה על חרוז: מפעילה/מכבה את כל החרוזים עד אליו בשורה
  function onBeadClick(e){
    const bead=e.currentTarget;
    const r=+bead.dataset.row;
    const idx=+bead.dataset.idx;
    // אם החרוז כבר פעיל ולחצנו עליו - נכבה ממנו והלאה (נשאיר idx פעילים)
    let newCount;
    if(beadState[r]===idx+1){ newCount=idx; }      // לחיצה חוזרת -> מוריד אחד
    else { newCount=idx+1; }                        // אחרת -> מפעיל עד כאן
    beadState[r]=newCount;
    const rod=bead.parentElement;
    [...rod.querySelectorAll('.bead')].forEach((bd,i)=>{
      bd.classList.toggle('on', i<newCount);
      bd.classList.toggle('off', i>=newCount);
    });
    updateAbacusCount();
  }

  function updateAbacusCount(){
    const total=beadState.reduce((s,n)=>s+n,0);
    abNumEl.textContent=total;
    // רמז קטן: כמה שורות מלאות
    if(total>0 && a>0){
      abHintEl.textContent = '';
    } else {
      abHintEl.textContent='';
    }
  }

  function resetAbacus(){
    for(let r=0;r<ROWS;r++) beadState[r]=0;
    rodsEl.querySelectorAll('.bead').forEach(bd=>{
      bd.classList.remove('on'); bd.classList.add('off');
    });
    updateAbacusCount();
  }

  // ---- יצירת תרגיל ----
  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function newQuestion(){
    locked=false;
    a=Math.floor(Math.random()*9)+1; // 1..9
    b=Math.floor(Math.random()*9)+1;
    answer=a*b;

    eqEl.innerHTML = '<span class="n">'+a+'</span> <span class="x">×</span> <span class="n">'+b+'</span> <span class="x">=</span> <span class="q">?</span>';

    // יצירת 3 תשובות שגויות סבירות
    const options=new Set([answer]);
    let guard=0;
    while(options.size<4 && guard<200){
      guard++;
      let delta=Math.floor(Math.random()*9)-4; // -4..4
      let cand=answer+delta;
      // לפעמים תשובה שגויה מבוססת על כפל קרוב
      if(Math.random()<0.5){
        const da=a+(Math.random()<0.5?1:-1);
        const db=b+(Math.random()<0.5?1:-1);
        cand=Math.max(1,da)*Math.max(1,db);
      }
      if(cand>0 && cand<=99 && cand!==answer) options.add(cand);
    }
    const opts=shuffle([...options]);

    ansEl.innerHTML='';
    opts.forEach(val=>{
      const btn=document.createElement('button');
      btn.className='answer-btn';
      btn.textContent=val;
      btn.addEventListener('click',()=>checkAnswer(val,btn));
      ansEl.appendChild(btn);
    });

    msgEl.className='feedback-msg';
    msgEl.textContent='';
    nextBtn.classList.remove('show');
    resetAbacus();
  }

  // ---- בדיקת תשובה ----
  const goodMsgs=['עילי אלוף! 🏆','עילי אלוף! 🎉','עילי אלוף! 🌟','עילי אלוף! 👏','עילי אלוף! 💫'];
  const tryMsgs =['כמעט! נסה שוב 💪','אופס, נסה עוד פעם 🤔','לא נורא, תספור בחשבוניה 🧮'];

  function checkAnswer(val,btn){
    if(locked) return;
    if(val===answer){
      locked=true;
      btn.classList.add('correct');
      [...ansEl.children].forEach(b=>b.disabled=true);
      score++;
      scoreEl.textContent=score;
      msgEl.textContent=goodMsgs[Math.floor(Math.random()*goodMsgs.length)];
      msgEl.className='feedback-msg good show';
      nextBtn.classList.add('show');
      celebrate();
    } else {
      btn.classList.add('wrong');
      btn.disabled=true;
      msgEl.textContent=tryMsgs[Math.floor(Math.random()*tryMsgs.length)];
      msgEl.className='feedback-msg try show';
    }
  }

  // ---- קונפטי ----
  function celebrate(){
    const colors=['#ff6b6b','#feca57','#8bd450','#4ecdc4','#54a0ff','#9b5de5','#f368e0'];
    for(let i=0;i<28;i++){
      const c=document.createElement('div');
      c.className='confetti';
      c.style.left=Math.random()*100+'vw';
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.animation=`fall ${1+Math.random()*1.4}s linear ${Math.random()*0.3}s forwards`;
      if(Math.random()<0.5) c.style.borderRadius='50%';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),3000);
    }
  }

  nextBtn.addEventListener('click',newQuestion);

  // ---- אתחול ----
  buildAbacus();
  newQuestion();
})();
</script>
</body>
</html>
